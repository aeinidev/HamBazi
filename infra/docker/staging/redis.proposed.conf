# REVIEW DRAFT: server-authenticated TLS + separate password ACLs; no client-cert bypass.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-protocols "TLSv1.2 TLSv1.3"
tls-cert-file /run/hambazi/tls/redis-cert.pem
tls-key-file /run/hambazi/tls/redis-key.pem
tls-ca-cert-file /run/hambazi/tls/data-ca.pem
# Existing API/Worker clients use server verification and ACLs, not client certificates.
tls-auth-clients no
aclfile /tmp/users.acl
save ""
appendonly no
maxmemory 256mb
maxmemory-policy noeviction
maxclients 64
slowlog-log-slower-than -1
loglevel warning
