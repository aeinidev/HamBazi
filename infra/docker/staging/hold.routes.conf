server {
  listen 8080 default_server;
  server_name staging.hambazi.top api-staging.hambazi.top bot-staging.hambazi.top;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
  location / { return 308 https://$host$request_uri; }
}
server {
  listen 8443 ssl default_server;
  server_name staging.hambazi.top api-staging.hambazi.top bot-staging.hambazi.top;
  ssl_certificate /run/hambazi/public-tls/fullchain.pem;
  ssl_certificate_key /run/hambazi/public-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location / { return 503; }
}
