# Private Unix socket for image bootstrap only; no socket mount into application roles.
local all all trust
# SCRAM + TLS only. These are proposed data IP/peer restrictions, not applied rules.
hostssl hambazi hambazi_api 10.89.18.10/32 scram-sha-256
hostssl hambazi hambazi_worker 10.89.18.12/32 scram-sha-256
# One-shot host runner uses the internal bridge gateway; migrator never enters app envs.
hostssl hambazi hambazi_migrator 10.89.18.1/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
