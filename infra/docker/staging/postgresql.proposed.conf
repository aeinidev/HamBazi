# REVIEW DRAFT: temporary synthetic staging only; do not start services from this file.
listen_addresses = '*'
port = 5432
max_connections = 32
shared_buffers = '128MB'
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/run/hambazi/tls/postgres-cert.pem'
ssl_key_file = '/run/hambazi/tls/postgres-key.pem'
ssl_ca_file = '/run/hambazi/tls/data-ca.pem'
hba_file = '/run/hambazi/pg_hba.conf'
password_encryption = 'scram-sha-256'
fsync = on
full_page_writes = on
archive_mode = off
logging_collector = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
