server {
  listen 8080 default_server;
  server_name _;
  return 444;
}
server {
  listen 8080;
  server_name staging.hambazi.top api-staging.hambazi.top bot-staging.hambazi.top;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
  location / { return 308 https://$host$request_uri; }
}
server {
  listen 8443 ssl;
  server_name staging.hambazi.top;
  ssl_certificate /run/hambazi/public-tls/fullchain.pem;
  ssl_certificate_key /run/hambazi/public-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location ~ ^/(v1|metrics|health|internal|admin|socket.io)(/|$) { return 404; }
  location / {
    limit_except GET { deny all; }
    proxy_pass_request_headers off;
    proxy_set_header Host staging.hambazi.top;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://10.89.18.13:8080;
  }
}
server {
  listen 8443 ssl;
  server_name api-staging.hambazi.top;
  ssl_certificate /run/hambazi/public-tls/fullchain.pem;
  ssl_certificate_key /run/hambazi/public-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  proxy_pass_request_headers off;
  proxy_set_header Host api-staging.hambazi.top;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Origin $http_origin;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
  proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host api-staging.hambazi.top;
  proxy_hide_header Strict-Transport-Security;
  location ^~ /v1/personal/socket.io/ {
    limit_except GET { deny all; }
    proxy_http_version 1.1;
    # Local proxy headers replace the server-level set in Nginx.
    # Retain the explicit trust boundary for the WebSocket upgrade.
    proxy_set_header Host api-staging.hambazi.top;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host api-staging.hambazi.top;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 45s;
    proxy_pass http://10.89.18.10:8080;
  }
  location = /v1/auth/telegram-mini-app/account {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://10.89.18.10:8080;
  }
  location = /v1/auth/telegram-mini-app {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://10.89.18.10:8080;
  }
  location = /v1/auth/session {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://10.89.18.10:8080;
  }
  location = /v1/auth/logout {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://10.89.18.10:8080;
  }
  location = /v1/me {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://10.89.18.10:8080;
  }
  location / { return 404; }
}
server {
  listen 8443 ssl;
  server_name bot-staging.hambazi.top;
  ssl_certificate /run/hambazi/public-tls/fullchain.pem;
  ssl_certificate_key /run/hambazi/public-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location / { return 404; }
}
