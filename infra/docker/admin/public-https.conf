# Candidate only. Include in nginx's http context after separately approved qualification.
limit_req_zone $binary_remote_addr zone=hambazi_admin_ip:10m rate=120r/m;
limit_req_zone $server_name zone=hambazi_admin_total:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=hambazi_admin_connections:10m;

map "$request_method:$uri" $hambazi_admin_api_allowed {
    default 0;
    "POST:/v1/admin/auth/login" 1;
    "POST:/v1/admin/auth/pin" 1;
    "POST:/v1/admin/auth/logout" 1;
    "POST:/v1/admin/auth/pin/change" 1;
    "POST:/v1/admin/auth/password/change" 1;
    ~^GET:/v1/admin/(me/access|session|overview|monitoring/summary|audit-events)$ 1;
    ~^GET:/v1/admin/(users|games|rooms|matches)(/[a-z0-9-]+)?$ 1;
    "~^GET:/v1/admin/(games|rooms|matches)/[a-z0-9-]+/details$" 1;
    "~^GET:/v1/admin/users/[a-f0-9-]{36}/(profile|history|restrictions)$" 1;
    "~^GET:/v1/admin/operations/[a-f0-9-]{36}/private-note$" 1;
    "GET:/v1/admin/management/meta" 1;
    "GET:/v1/admin/admins" 1;
    "GET:/v1/admin/operations" 1;
    "POST:/v1/admin/operations" 1;
    "~^GET:/v1/admin/admins/[a-f0-9-]{36}/(sessions|activity)$" 1;
    "~^GET:/v1/admin/operations/[a-f0-9-]{36}$" 1;
    "~^POST:/v1/admin/operations/[a-f0-9-]{36}/(approve|execute|renew)$" 1;
}
map $uri $hambazi_admin_auth_key {
    default "";
    ~^/v1/admin/auth/(login|pin|pin/change|password/change)$ $binary_remote_addr;
    "~^/v1/admin/operations/[a-f0-9-]{36}/approve$" $binary_remote_addr;
}
limit_req_zone $hambazi_admin_auth_key zone=hambazi_admin_auth_routes:10m rate=20r/m;
map $hambazi_admin_auth_key $hambazi_admin_auth_global {
    "" "";
    default "admin";
}
limit_req_zone $hambazi_admin_auth_global zone=hambazi_admin_auth_total:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.hambazi.top;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/hambazi-admin-error.log crit;
    if ($host != admin.hambazi.top) { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-admin;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 308 https://admin.hambazi.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.hambazi.top;
    ssl_certificate /etc/letsencrypt/live/hambazi-admin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hambazi-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/hambazi-admin-error.log crit;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    if ($http_host != admin.hambazi.top) { return 444; }
    if ($ssl_server_name != admin.hambazi.top) { return 444; }
    # Admission stays closed until the approved live certificate/renewal checks pass.
    if (!-f /var/www/hambazi-admin/public-enabled) { return 503; }
    if (-f /var/www/hambazi-admin/maintenance) { return 503; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=hambazi_admin_ip burst=20 nodelay;
    limit_req zone=hambazi_admin_total burst=30 nodelay;
    limit_req zone=hambazi_admin_auth_routes burst=10 nodelay;
    limit_req zone=hambazi_admin_auth_total burst=10 nodelay;
    limit_conn hambazi_admin_connections 10;
    error_page 429 = @admin_rate_limited;
    root /var/www/hambazi-admin/client;
    location ^~ /v1/admin/ {
        if ($hambazi_admin_api_allowed = 0) { return 404; }
        proxy_pass https://10.89.18.14:9444;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        # Only the explicit session/CSRF inputs cross; Backend rejects Authorization.
        # Forwarding, external identity claims and telemetry headers are discarded.
        proxy_pass_request_headers off;
        proxy_set_header Host admin.hambazi.top;
        proxy_set_header Connection "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Hambazi-Client-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name admin-api.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /opt/hambazi/admin/private/tls/service-ca.pem;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }
    location @admin_rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"error":{"code":"RATE_LIMITED","message":"Too many requests","retryable":false}}';
    }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { return 404; }
}
