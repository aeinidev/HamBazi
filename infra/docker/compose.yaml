name: hambazi-local

services:
  postgres:
    image: hambazi-local/postgres:18.6-alpine3.24-v1@sha256:18f4eaef9fda255d3b10a16c62c72a92864b69a6b4eb4ded1145b349f06d514a
    pull_policy: never
    entrypoint: [/bin/sh, /usr/local/bin/hambazi-postgres.sh]
    environment:
      POSTGRES_USER: hambazi_local_admin
      POSTGRES_DB: hambazi
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm infra:env}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?Run pnpm infra:env}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Run pnpm infra:env}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run pnpm infra:env}
    ports:
      - target: 5432
        published: ${POSTGRES_HOST_PORT:-5432}
        host_ip: 127.0.0.1
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./postgres/99-image-policy.sh:/docker-entrypoint-initdb.d/99-image-policy.sh:ro
      - ./postgres/start.sh:/usr/local/bin/hambazi-postgres.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [private]

  redis:
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    user: redis
    entrypoint: [/bin/sh, /usr/local/bin/hambazi-redis.sh]
    environment:
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?Run pnpm infra:env}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?Run pnpm infra:env}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?Run pnpm infra:env}
    ports:
      - target: 6379
        published: ${REDIS_HOST_PORT:-6379}
        host_ip: 127.0.0.1
    volumes:
      - ./redis/start.sh:/usr/local/bin/hambazi-redis.sh:ro
    tmpfs:
      - /tmp:mode=1777
      - /data:mode=1777
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_HEALTH_PASSWORD" redis-cli --user health ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [private]

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-hambazi-local}_postgres-data}

networks:
  private:
    internal: true
