name: hambazi-local

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: hambazi_local_admin
      POSTGRES_DB: hambazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm infra:env}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?Run pnpm infra:env}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Run pnpm infra:env}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run pnpm infra:env}
    ports:
      - target: 5432
        published: ${POSTGRES_HOST_PORT:-5432}
        host_ip: 127.0.0.1
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [private]

  redis:
    image: redis:8.10.1-trixie@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    user: redis
    entrypoint: [/bin/sh, /usr/local/bin/hambazi-redis.sh]
    environment:
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?Run pnpm infra:env}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?Run pnpm infra:env}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?Run pnpm infra:env}
    ports:
      - target: 6379
        published: ${REDIS_HOST_PORT:-6379}
        host_ip: 127.0.0.1
    volumes:
      - ./redis/start.sh:/usr/local/bin/hambazi-redis.sh:ro
    tmpfs:
      - /tmp:mode=1777
      - /data:mode=1777
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_HEALTH_PASSWORD" redis-cli --user health ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [private]

volumes:
  postgres-data:

networks:
  private:
    internal: true
