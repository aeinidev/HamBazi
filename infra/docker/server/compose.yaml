# Replacement restricted staging on 89.46.217.9. Private role files are not in Git.
name: hambazi-server
services:
  postgres-staging:
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    image: hambazi-security/postgres-staging:20261024-brotli@sha256:646e47d029792855c984a6c1123a97843ee7456e0df5579683b99cba111641aa
    entrypoint:
      - /bin/sh
      - /usr/local/bin/hambazi-postgres.sh
    command:
      - postgres
      - -c
      - config_file=/run/hambazi/postgresql.conf
    env_file:
      - path: /opt/hambazi/private/postgres-bootstrap.env
        format: raw
    stop_grace_period: 45s
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: /opt/hambazi/private/postgres-start.sh
        target: /usr/local/bin/hambazi-postgres.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgres-10-roles.sh
        target: /docker-entrypoint-initdb.d/10-roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgres-99-image-policy.sh
        target: /docker-entrypoint-initdb.d/99-image-policy.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgresql.proposed.conf
        target: /run/hambazi/postgresql.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/pg_hba.proposed.conf
        target: /run/hambazi/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/postgres-key.pem
        target: /run/hambazi/tls/postgres-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/postgres-cert.pem
        target: /run/hambazi/tls/postgres-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 10.89.18.20
        aliases:
          - postgres-staging
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  redis-staging:
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    image: hambazi-security/redis-staging:20261023-musl@sha256:a2b3313295aa496436419ae5a5a14508ab2058ba39f1d6b1bcd1dcfd50cff57c
    user: redis
    read_only: true
    cap_drop:
      - ALL
    entrypoint:
      - /bin/sh
      - /usr/local/bin/hambazi-redis-tls.sh
    env_file:
      - path: /opt/hambazi/private/redis-bootstrap.env
        format: raw
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
      - /data:rw,nosuid,noexec,size=16m,mode=1777
    volumes:
      - type: bind
        source: /opt/hambazi/private/start-redis-tls.sh
        target: /usr/local/bin/hambazi-redis-tls.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/redis.proposed.conf
        target: /run/hambazi/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/redis-key.pem
        target: /run/hambazi/tls/redis-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/redis-cert.pem
        target: /run/hambazi/tls/redis-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 45s
    networks:
      private:
        ipv4_address: 10.89.18.21
        aliases:
          - redis-staging
  api:
    image: hambazi-security/api:20261024-zod466-026b1f826a9c@sha256:0c500843ddda1359451e410db6e93df8cee7c99aa359afb8aac495e6deeb558a
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 40s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/api.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.10
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-key.pem
        target: /run/hambazi/tls/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-cert.pem
        target: /run/hambazi/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/owner-admission.json
        target: /run/hambazi/owner-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/staging-test-admission.json
        target: /run/hambazi/staging-test-admission.json
        read_only: true
        bind:
          create_host_path: false
  bot:
    image: hambazi-security/bot:20261024-zod466-026b1f826a9c@sha256:a92fcbfdeec4e754d90bdf75f9884e6916bdba147520650a1d271fbec92263cc
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/bot.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.11
      egress:
        ipv4_address: 10.89.19.2
        gw_priority: 1
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/bot-key.pem
        target: /run/hambazi/tls/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/bot-cert.pem
        target: /run/hambazi/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/owner-admission.json
        target: /run/hambazi/owner-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/staging-test-admission.json
        target: /run/hambazi/staging-test-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-ca.pem
        target: /run/hambazi/tls/api-ca.pem
        read_only: true
        bind:
          create_host_path: false
  worker:
    image: hambazi-security/worker:20261024-zod466-026b1f826a9c@sha256:5ae0219afa0a9912729990789f9fb2739d6e883e6b37b9f1e06036730d7dd783
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 70s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/worker.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.12
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
  web:
    image: hambazi-header-icons/web:20261025-3e1da9c675c0f176@sha256:98f2488faf1b369604529d514b51d53617f59330e407ccc32313f2f213c33998
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/web.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.13
    volumes: []
volumes:
  postgres-data:
    name: hambazi-server-postgres-20261020
networks:
  private:
    name: hambazi-server-private
    internal: true
    ipam:
      config:
        - subnet: 10.89.18.0/24
  egress:
    name: hambazi-server-bot-egress
    ipam:
      config:
        - subnet: 10.89.19.0/24
