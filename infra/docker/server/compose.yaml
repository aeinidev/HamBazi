# Replacement restricted staging on 89.46.217.9. Private role files are not in Git.
name: hambazi-server
services:
  postgres-staging:
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    image: hambazi-security/postgres-staging:20261107-zlib@sha256:2d22fd36f5641f795fbc33f35de72bfc31c726627169f1b7ab909ddfe2225bde
    entrypoint:
      - /bin/sh
      - /usr/local/bin/hambazi-postgres.sh
    command:
      - postgres
      - -c
      - config_file=/run/hambazi/postgresql.conf
    env_file:
      - path: /opt/hambazi/private/postgres-bootstrap.env
        format: raw
    stop_grace_period: 45s
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: /opt/hambazi/private/postgres-start.sh
        target: /usr/local/bin/hambazi-postgres.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgres-10-roles.sh
        target: /docker-entrypoint-initdb.d/10-roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgres-99-image-policy.sh
        target: /docker-entrypoint-initdb.d/99-image-policy.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/postgresql.proposed.conf
        target: /run/hambazi/postgresql.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/pg_hba.proposed.conf
        target: /run/hambazi/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/postgres-key.pem
        target: /run/hambazi/tls/postgres-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/postgres-cert.pem
        target: /run/hambazi/tls/postgres-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 10.89.18.20
        aliases:
          - postgres-staging
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  redis-staging:
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    image: hambazi-security/redis-staging:20261107-zlib@sha256:4cb23e046fb86b8328f65b4d50510beb9c0d09f96be1daac4ef5953172c67452
    user: redis
    read_only: true
    cap_drop:
      - ALL
    entrypoint:
      - /bin/sh
      - /usr/local/bin/hambazi-redis-tls.sh
    env_file:
      - path: /opt/hambazi/private/redis-bootstrap.env
        format: raw
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
      - /data:rw,nosuid,noexec,size=16m,mode=1777
    volumes:
      - type: bind
        source: /opt/hambazi/private/start-redis-tls.sh
        target: /usr/local/bin/hambazi-redis-tls.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/redis.proposed.conf
        target: /run/hambazi/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/redis-key.pem
        target: /run/hambazi/tls/redis-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/redis-cert.pem
        target: /run/hambazi/tls/redis-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 45s
    networks:
      private:
        ipv4_address: 10.89.18.21
        aliases:
          - redis-staging
  api:
    image: hambazi-profile-hub/api:20261109-dffa31e7d677310b@sha256:18f586952ea3314de68a7960c006ab42b48121b7bd029c6a239d4eef1a95cd6c
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 40s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/api.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.10
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-key.pem
        target: /run/hambazi/tls/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-cert.pem
        target: /run/hambazi/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/owner-admission.json
        target: /run/hambazi/owner-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/staging-test-admission.json
        target: /run/hambazi/staging-test-admission.json
        read_only: true
        bind:
          create_host_path: false
  bot:
    image: hambazi-candidate/bot:c7add7bf7b32e77b153abc6ebb411d4954e4a668-5161e94f91139e1a@sha256:9c85b3dfcf1cffef1a0eef26d3f8078097fe198915955654bbfbee4da4a23ad8
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/bot.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.11
      egress:
        ipv4_address: 10.89.19.2
        gw_priority: 1
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/bot-key.pem
        target: /run/hambazi/tls/key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/bot-cert.pem
        target: /run/hambazi/tls/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/owner-admission.json
        target: /run/hambazi/owner-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/staging-test-admission.json
        target: /run/hambazi/staging-test-admission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hambazi/private/tls/api-ca.pem
        target: /run/hambazi/tls/api-ca.pem
        read_only: true
        bind:
          create_host_path: false
  worker:
    image: hambazi-candidate/worker:c7add7bf7b32e77b153abc6ebb411d4954e4a668-5161e94f91139e1a@sha256:e891d537505b1d6c65ff291496d4062a86d294598ee795dbd2b24dc760398338
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 70s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/worker.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.12
    volumes:
      - type: bind
        source: /opt/hambazi/private/tls/data-ca.pem
        target: /run/hambazi/tls/data-ca.pem
        read_only: true
        bind:
          create_host_path: false
  web:
    image: hambazi-profile-ux/web:20261110-962afb12ddcef7c9@sha256:c5f8309c45c4a3030c2eb92668a1de2c1c4257492e9e712c77d53912adebc32b
    platform: linux/amd64
    pull_policy: never
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    env_file:
      - path: /opt/hambazi/private/web.env
        format: raw
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"
    networks:
      private:
        ipv4_address: 10.89.18.13
    volumes: []
volumes:
  postgres-data:
    name: hambazi-server-postgres-20261020
networks:
  private:
    name: hambazi-server-private
    internal: true
    ipam:
      config:
        - subnet: 10.89.18.0/24
  egress:
    name: hambazi-server-bot-egress
    ipam:
      config:
        - subnet: 10.89.19.0/24
