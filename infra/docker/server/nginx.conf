server { listen 80 default_server; server_name _; access_log off; error_log /dev/null crit; server_tokens off; return 444; }
server {
 listen 80;
 server_name staging.hambazi.top api-staging.hambazi.top bot-staging.hambazi.top;
 access_log off; error_log /dev/null crit; server_tokens off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/hambazi-acme; try_files $uri =404; }
 location / { return 308 https://$host$request_uri; }
}
server { listen 443 ssl default_server; server_name _;
ssl_certificate /etc/letsencrypt/live/hambazi-staging/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/hambazi-staging/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:HBZTLS:1m;
 ssl_session_tickets off;
 access_log off;
 error_log /dev/null crit;
 server_tokens off;
 client_max_body_size 64k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 keepalive_timeout 15s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
 proxy_hide_header Strict-Transport-Security;
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_hide_header Permissions-Policy;
 proxy_buffering off;
 proxy_request_buffering off;
 proxy_next_upstream off;
 proxy_connect_timeout 3s;
 proxy_read_timeout 10s;
 proxy_send_timeout 10s;
 return 444;
}
server {
 listen 443 ssl;
 server_name staging.hambazi.top;
ssl_certificate /etc/letsencrypt/live/hambazi-staging/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/hambazi-staging/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:HBZTLS:1m;
 ssl_session_tickets off;
 access_log off;
 error_log /dev/null crit;
 server_tokens off;
 client_max_body_size 64k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 keepalive_timeout 15s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
 proxy_hide_header Strict-Transport-Security;
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_hide_header Permissions-Policy;
 proxy_buffering off;
 proxy_request_buffering off;
 proxy_next_upstream off;
 proxy_connect_timeout 3s;
 proxy_read_timeout 10s;
 proxy_send_timeout 10s;
proxy_pass_request_headers off;
 proxy_set_header Host $host;
 proxy_set_header Authorization $http_authorization;
 proxy_set_header Origin $http_origin;
 proxy_set_header Content-Type $http_content_type;
 proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
 proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
 proxy_set_header Idempotency-Key $http_idempotency_key;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-Host $host;
location ~ (^|/)\. { return 404; }
 location ~ ^/v1/(personal|kahroba)/socket[.]io/?$ {
  limit_except GET { deny all; }
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
  proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 45s;
  proxy_pass http://10.89.18.10:8080;
 }
 location = /v1/me {
  client_max_body_size 256k;
  limit_except GET PATCH OPTIONS { deny all; }
  proxy_pass http://10.89.18.10:8080;
 }
 location = /v1/me/username-availability {
  limit_except GET OPTIONS { deny all; }
  proxy_pass http://10.89.18.10:8080;
 }
 location ~ ^/v1/(auth/(telegram-mini-app(/(account|registered-session|registered-session-photo))?|session|logout)|me(/stats)?|games/availability)$ {
  limit_except GET POST PATCH OPTIONS { deny all; }
  proxy_pass http://10.89.18.10:8080;
 }
 location ~ ^/v1/(personal|kahroba)(/|$) {
  limit_except GET POST OPTIONS { deny all; }
  proxy_pass http://10.89.18.10:8080;
 }
 location ~ ^/(v1|metrics|health|internal|admin|socket[.]io)(/|$) { return 404; }
 location / { limit_except GET { deny all; } proxy_pass_request_headers off; proxy_set_header Host staging.hambazi.top; proxy_set_header Accept-Encoding $http_accept_encoding; proxy_set_header If-None-Match $http_if_none_match; proxy_pass http://10.89.18.13:8080; }
}
