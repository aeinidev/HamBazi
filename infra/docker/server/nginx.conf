server {
 listen 443 ssl;
 server_name bot-staging.hambazi.top;
ssl_certificate /etc/letsencrypt/live/hambazi-staging/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/hambazi-staging/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:HBZTLS:1m;
 ssl_session_tickets off;
 access_log off;
 error_log /dev/null crit;
 server_tokens off;
 client_max_body_size 64k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 keepalive_timeout 15s;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
 proxy_hide_header Strict-Transport-Security;
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_hide_header Permissions-Policy;
 proxy_buffering off;
 proxy_request_buffering off;
 proxy_next_upstream off;
 proxy_connect_timeout 3s;
 proxy_read_timeout 10s;
 proxy_send_timeout 10s;
location = /v1/telegram/webhook {
  limit_except POST { deny all; }
  if ($args != "") { return 404; }
  proxy_pass_request_headers off;
  proxy_set_header Host 10.89.18.11;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
  proxy_ssl_trusted_certificate /opt/hambazi/private/tls/api-ca.pem;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_name bot-staging;
  proxy_ssl_server_name on;
  proxy_pass https://10.89.18.11:9444;
 }
 location / { return 404; }
}
