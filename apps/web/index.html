<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#001226" />
    <meta name="description" content="هم‌بازی؛ بازی‌های جذاب با دوستان در تلگرام" />
    <link
      rel="preload"
      href="/assets/fonts/Vazirmatn-4e3fa217d38f.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/ui/launch.css" />
    <link rel="stylesheet" href="/src/ui/desktop-frame.css" />
    <title>HamBazi · هم‌بازی</title>
  </head>
  <body>
    <div id="root">
      <div class="hambazi-loading" role="status" lang="fa" aria-label="در حال بارگذاری هم‌بازی">
        <div class="hambazi-loading-stars" aria-hidden="true"></div>
        <div class="hambazi-loading-scene">
          <img
            class="hambazi-loading-art"
            src="/assets/loading/tabletop-extended-640-f0d102a98360.webp"
            srcset="
              /assets/loading/tabletop-extended-640-f0d102a98360.webp   640w,
              /assets/loading/tabletop-extended-1024-3fab4717a03b.webp 1024w
            "
            sizes="(max-height: 380px) 52vw, (max-width: 640px) 100vw, 640px"
            width="1024"
            height="1792"
            alt=""
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <div class="hambazi-loading-content" aria-hidden="true">
          <div class="hambazi-loading-mark"></div>
          <div class="hambazi-loading-name"><span>هم</span>‌بازی</div>
          <p class="hambazi-loading-tagline">دور هم بازی کنیم، خاطره بسازیم</p>
          <div class="hambazi-loading-progress">
            <div class="hambazi-loading-track"></div>
            <p class="hambazi-loading-caption">
              <span class="hambazi-loading-orbit"></span>
              در حال آماده‌سازی میز بازی<span class="hambazi-loading-dots">…</span>
            </p>
          </div>
        </div>
        <div class="hambazi-loading-footer" aria-hidden="true">
          <span>✦</span> کنار هم، بیشتر خوش می‌گذره <span>✦</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
